{{- range $serviceName, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "retail.labels" (dict "serviceName" $serviceName "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    name: http
  selector:
    app.kubernetes.io/name: {{ $serviceName | quote }}
{{- end }}
{{- end }}