apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: retail-ui
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

spec:
  namespaceSelector:
    matchNames:
      - retail
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  endpoints:
    - port: http
      interval: 30s
      path: /actuator/prometheus

---

