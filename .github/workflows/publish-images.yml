name: Publish Images

on:
    push: 
        branches: 
            - main
    
permissions: 
    contents: read
    id-token: none

concurrency: 
    group: publish-images-${{github.sha}}
    cancel-in-progress: false

jobs:

    detect-container-changes:
      runs-on: ubuntu-latest
      timeout-minutes: 5  
      env:
        BASE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }} 
      outputs:
        matrix: ${{ steps.select.outputs.matrix }}
        has_change: ${{ steps.select.outputs.has_change }}
        selected_services: ${{ steps.select.outputs.selected_services }}
      steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
          with:
            persist-credentials: false
            fetch-depth: 0

        
        
        - name: test path
          run: ls .github/scripts/detect_container_changes.sh 
        - name: Select affected services
          id: select
          shell: bash
          run: bash .github/scripts/detect_container_changes.sh

    publish-container:
      name: Publish container — ${{ matrix.service }}
      needs: detect-container-changes
      if: needs.detect-container-changes.outputs.has_change == 'true'
      runs-on: ubuntu-latest
      timeout-minutes: 15

      permissions:
        contents: read
        id-token: write

      strategy:
        fail-fast: false
        matrix: ${{ fromJson(needs.detect-container-changes.outputs.matrix) }}

      steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: configure aws credentials through oidc
          uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
          with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION }}
            role-session-name: ecr-publish-${{ github.run_id }}-${{ matrix.service }}

        - name: verify aws credentials
          run: aws sts get-caller-identity

        - name: login to ecr
          uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
          id: ecr-login
          with:
            mask-password: true

        - name: set up docker buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

        - name: set up trivy
          uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
          with:
            version: v0.74.0
            cache: true
        - name: prepare publish metadata
          id: meta
          shell: bash
          env:
            REGISTRY: ${{ steps.ecr-login.outputs.registry }}
            SERVICE: ${{ matrix.service }}
            SOURCE_SHA: ${{ github.sha }}
          run: |
            repo="retail-${SERVICE}"
            image="${REGISTRY}/${repo}:${SOURCE_SHA}"
            
            echo "repository=${repo}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
            echo "image_uri=${image}" >> "${GITHUB_OUTPUT}"
            

        - name: check immutability of image tag
          id: exist
          shell: bash
          env:
            REPO: ${{ steps.meta.outputs.repository }}
            IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          run: |
            digest="$(
                aws ecr batch-get-image \
                --repository-name "${REPO}" \
                --image-ids \
                "imageTag=${IMAGE_TAG}" \
                --query 'images[0].imageId.imageDigest' 	              --output text
              )"
            if [[ -n "$digest" && "$digest" != "None" ]]; then
              echo "Image tag already exists in ECR: ${REPO}:${IMAGE_TAG}"
              echo "existing_digest=true" >> "${GITHUB_OUTPUT}"
              echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
            else
              echo "Image tag does not exist in ECR: ${REPO}:${IMAGE_TAG}"
              echo "existing_digest=false" >> "${GITHUB_OUTPUT}"
              echo "digest=" >> "${GITHUB_OUTPUT}"
            fi
        - name: build release image
          id: build
          if: steps.exist.outputs.existing_digest == 'false'
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
          with:
            context: ${{ matrix.context }}
            file: ${{ matrix.dockerfile }}
            push: false
            load: true
            tags: ${{ steps.meta.outputs.image_uri }}
            cache-from: type=gha,scope=retail-${{ matrix.service }}
            cache-to: type=gha,mode=max,scope=retail-${{ matrix.service }}

        - name: create trivy image report 
          if: steps.exist.outputs.existing_digest == 'false'
          shell: bash
          env:
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            SERVICE: ${{ matrix.service }}
          run: |
            mkdir -p reports
            trivy image \
              --severity HIGH,CRITICAL \
              --format json \
              --output "reports/trivy-image-${SERVICE}.json" \
              "${IMAGE_URI}"

        - name: gate fixable high and critical release
          if: steps.exist.outputs.existing_digest == 'false'
          shell: bash
          env:
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            SERVICE: ${{ matrix.service }}
          run: |
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "${IMAGE_URI}"

        - name: push scanned image to ecr
          if: steps.exist.outputs.existing_digest == 'false'
          env:
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          run: docker push "${IMAGE_URI}"

        - name: verify immutable ecr artifact 
          id: verify
          shell: bash
          env:
            REPO: ${{ steps.meta.outputs.repository }}
            IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          run: |
            digest="$(
                aws ecr batch-get-image \
                --repository-name "${REPO}" \
                --image-ids "imageTag=${IMAGE_TAG}" \
                --query 'images[0].imageId.imageDigest' \
                --output text
              )"
            test -n "$digest" && test "$digest" != "None"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
        - name: write publish record 
          shell: bash
          env:
            SERVICE: ${{ matrix.service }}
            SOURCE_SHA: ${{ github.sha }}
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            DIGEST: ${{ steps.verify.outputs.digest }}
            ALREADY_EXISTS: ${{ steps.exist.outputs.existing_digest }}
          run: |
            mkdir -p reports
            if [[ "${ALREADY_EXISTS}" == "true" ]]; then
              echo "Image already exists in ECR: ${IMAGE_URI}"
            else
              echo "Image published to ECR: ${IMAGE_URI}"
            fi
            {
              echo "service: ${SERVICE}"
              echo "source_sha: ${SOURCE_SHA}"
              echo "image_uri: ${IMAGE_URI}"
              echo "digest: ${DIGEST}"
              echo "already_exists: ${ALREADY_EXISTS}"
            } | tee "reports/publish-${SERVICE}.txt" >> ${GITHUB_STEP_SUMMARY}

        - name: upload publish evidance
          if: always()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          with:
            name: ecr-publish-${{ matrix.service }}-${{ github.sha }}
            path: reports
            if-no-files-found: error
            retention-days: 14
        
        - name: publish gate
          if: always()
          shell: bash
          env:
            SERVICE: ${{ matrix.service }}
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            DIGEST: ${{ steps.verify.outputs.digest }}
            ALREADY_EXISTS: ${{ steps.exist.outputs.existing_digest }}
          run: |
            if [[ "${ALREADY_EXISTS}" == "true" ]]; then
              echo "Image already exists in ECR: ${IMAGE_URI}"
            else
              echo "Image published to ECR: ${IMAGE_URI}"
            fi
            {
              echo "service: ${SERVICE}"
              echo "image_uri: ${IMAGE_URI}"
              echo "digest: ${DIGEST}"
              echo "already_exists: ${ALREADY_EXISTS}"
            } >> ${GITHUB_STEP_SUMMARY}

    publish-gate:
      name: ecr publish gate
      needs: 
        - publish-container
        - detect-container-changes
      if: always()
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: publish gate summary
          shell: bash
          run: |
            test "${{ needs.detect-container-changes.result }}" = "success"

            if [[ "${{ needs.detect-container-changes.outputs.has_change }}" == "true" ]]; then
                test "${{ needs.publish-container.result }}" = "success"
            else
                test "${{ needs.publish-container.result }}" = "skipped"
            fi