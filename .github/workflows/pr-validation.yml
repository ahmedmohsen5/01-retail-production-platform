name: PR Validation

on:
    pull_request: 
        branches: 
            - main
    
permissions: 
    contents: read
    id-token: none

concurrency: 
    group: pr-validation-${{github.event.pull_request.number}}
    cancel-in-progress: true

jobs:
    java-validation:
        name: java - ${{ matrix.service }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                service: [ui, cart, orders]
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: set up java 21
              uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
                  cache-dependency-path: application/${{ matrix.service }}/pom.xml
            - name: validation service
              working-directory: application/${{ matrix.service }}
              shell: bash
              run: |
                if [[ "${{ matrix.service }}" == "ui" ]]; then
                    mvn -B verify
                else
                    ./mvnw -B test -DexcludedGroups=integration
                fi

    catalog-validation:
        name: go - catalog
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: set up go 
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              with:
                  go-version: "1.25.14"
                  cache-dependency-path: application/catalog/go.sum
            - name: Run Catalog tests
              working-directory: application/catalog
              run: go test ./...


    checkout-validation:
        name: node - checkout
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: set up node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "22"
                  cache: yarn
                  cache-dependency-path: application/checkout/yarn.lock
            - name: enable corepack
              run: corepack enable
            - name: install dependances
              working-directory: application/checkout
              run: yarn install --immutable
            - name: Lint
              working-directory: application/checkout
              run: yarn lint
            - name: build
              working-directory: application/checkout
              run: yarn build


    terraform-validation:
        name: terraform
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
          - name: checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            with:
                persist-credentials: false
          - name: set up terraform 
            uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
            with:
                terraform_version: 1.16.4
          - name: Terraform format
            run: terraform fmt -check -recursive terraform/
          - name: validate bootstrap
            run: |
              terraform -chdir=terraform/bootstrap init -backend=false -input=false
              terraform -chdir=terraform/bootstrap validate -no-color
          - name: validate dev environment
            run: |
              terraform -chdir=terraform/env/dev init -backend=false -input=false
              terraform -chdir=terraform/env/dev validate -no-color
        
    
    kubernetes-validation:
        name: kubernetes
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                persist-credentials: false
            - name: install kubeconform v0.8.0
              shell: bash
              run: |
                version="v0.8.0"
                archive="kubeconform-linux-amd64.tar.gz"
                base="https://github.com/yannh/kubeconform/releases/download/${version}"
                curl -fsSLO "${base}/${archive}"
                curl -fsSLO "${base}/CHECKSUMS"
                grep "  ${archive}$" CHECKSUMS | sha256sum --check -
                    tar -xzf "${archive}"
                sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
                kubeconform -v
            - name: validate raw kubernetes manifest
              shell: bash 
              run: |
                    find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) ! -path 'k8s/platform/aws-load-balancer-controller/values-dev.yaml' -print0 | xargs -0 -r kubeconform -strict -summary -kubernetes-version 1.36.0
            - name: setup helm
              uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
            - name: render aws load balancer controller
              shell: bash
              run: |
                    helm repo add eks https://aws.github.io/eks-charts
                    helm repo update
                    helm template aws-load-balancer-controller eks/aws-load-balancer-controller \
                      --namespace kube-system \
                      --version 3.5.0 \
                      -f k8s/platform/aws-load-balancer-controller/values-dev.yaml \
                      > /tmp/aws-load-balancer-controller.yaml

                      kubeconform -strict -summary \
                      -kubernetes-version 1.36.0 \
                      -skip 'IngressClassParams' \
                      /tmp/aws-load-balancer-controller.yaml


    gate:
        name: PR validation gate
        if: always()
        runs-on: ubuntu-latest
        needs: 
            - java-validation
            - catalog-validation
            - checkout-validation
            - container-build
            - kubernetes-validation
            - terraform-validation
            - detect-container-changes
            - sonarqube-analyses
            - trivy-iac
            - trivy-repo
        steps:
          - name: verify required jobs
            shell: bash
            run: |
                test "${{ needs.java-validation.result }}" = "success"
                test "${{ needs.catalog-validation.result }}" = "success"
                test "${{ needs.checkout-validation.result }}" = "success"
                test "${{ needs.terraform-validation.result }}" = "success"
                test "${{ needs.kubernetes-validation.result }}" = "success"
                test "${{ needs.detect-container-changes.result }}" = "success"
                test "${{ needs.trivy-repo.result}}" == "success"
                test "${{ needs.trivy-iac.result}}" == "success"
                test "${{ needs.terraform-validation.result}}" == "success"
                test "${{ needs.sonarqube-analyses.result}}" == "success"
                if [[ "${{ needs.detect-container-changes.outputs.has_change }}" == 'true' ]]; then
                  test "${{ needs.container-build.result}}" = "success"
                else 
                  test "${{ needs.container-build.result}}" = "skipped"
                fi
          
#-------------------------------------------------------------------------------

    detect-container-changes:
      runs-on: ubuntu-latest
      timeout-minutes: 5   
      outputs:
        matrix: ${{ steps.select.outputs.matrix }}
        has_change: ${{ steps.select.outputs.has_change }}
        selected_services: ${{ steps.select.outputs.selected_services }}
      steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
          with:
            persist-credentials: false
            fetch-depth: 0

        - name: Test container selector
          run: python3 .github/scripts/test_select_container_builds.py
        
        - name: test path
          run: ls .github/scripts/detect_container_changes.sh 
        - name: Select affected services
          id: select
          shell: bash
          env:
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          run: bash .github/scripts/detect_container_changes.sh

    container-build:
      name: Container — ${{ matrix.service }}
      needs: 
        - detect-container-changes
      if: needs.detect-container-changes.outputs.has_change == 'true'
      runs-on: ubuntu-latest
      timeout-minutes: 30

      strategy:
        fail-fast: false
        matrix: ${{ fromJson(needs.detect-container-changes.outputs.matrix) }}

      steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: set up docker buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

        - name: Prepare image metadata
          id: meta
          shell: bash
          env:
            SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          run: |
            echo "short_sha=${SOURCE_SHA:0:12}" >> "${GITHUB_OUTPUT}"

        - name: set up trivy
          uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
          with:
            version: v0.74.0
            cache: true

        - name: Build ${{ matrix.service }}
          id: build
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
          with:
            context: ${{ matrix.context }}
            file: ${{ matrix.dockerfile }}
            push: false
            pull: true
            no-cache-filters: runtime
            load: true
            tags: retail-${{ matrix.service }}:pr-${{ steps.meta.outputs.short_sha}}
            cache-from: type=gha,scope=retail-${{ matrix.service }}
            cache-to: type=gha,mode=max,scope=retail-${{ matrix.service }}
          
        - name: publish build summary
          if: always()
          shell: bash
          env:
            SERVICE: ${{ matrix.service }}
            DOCKERFILE: ${{ matrix.dockerfile }}
            CONTEXT: ${{ matrix.context }}
            SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
            IMAGE_TAG: retail-${{ matrix.service }}:pr-${{ steps.meta.outputs.short_sha }}
            BUILD_OUTCOME: ${{ steps.build.outcome }}
          run: |
            {
              echo "### Container build — ${SERVICE}"
              echo
              printf -- '- Result: `%s`\n' "$BUILD_OUTCOME"
              printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
              printf -- '- Dockerfile: `%s`\n' "$DOCKERFILE"
              printf -- '- Context: `%s`\n' "$CONTEXT"
              printf -- '- Validation tag: `%s`\n' "$IMAGE_TAG"
              printf -- '- Cache scope: `retail-%s`\n' "$SERVICE"
              printf -- '- Published: `false`\n'
            } >> "${GITHUB_STEP_SUMMARY}"
        - name: create image scan report
          shell: bash
          env:
            IMAGE_REF: retail-${{ matrix.service }}:pr-${{ steps.meta.outputs.short_sha }}
          run: |
            mkdir -p reports

            trivy image \
              --severity HIGH,CRITICAL \
              --format json \
              --output "reports/trivy-image-${{ matrix.service }}.json" \
              "${IMAGE_REF}"
        
        - name: Gate fixable HIGH and CRITICAL image vulnerabilities
          env:
            IMAGE_REF: retail-${{ matrix.service }}:pr-${{ steps.meta.outputs.short_sha }}
          shell: bash
          run: |
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "${IMAGE_REF}"
        - name: Upload image security report
          if: always()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          with:
            name: trivy-image-${{ matrix.service }}-${{ github.event.pull_request.head.sha }}
            path: reports/trivy-image-${{ matrix.service }}.json
            if-no-files-found: error
            retention-days: 14
            

    publish-container:
      name: Publish container — ${{ matrix.service }}
      needs: 
        - container-build
      if: needs.detect-container-changes.outputs.has_change == 'true'
      runs-on: ubuntu-latest
      timeout-minutes: 15

      permissions:
        contents: read
        id-token: write

      strategy:
        fail-fast: false
        matrix: ${{ fromJson(needs.detect-container-changes.outputs.matrix) }}

      steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: configure aws credentials through oidc
          uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
          with:
            role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
            aws-region: ${{ vars.AWS_REGION }}
            role-session-name: ecr-publish-${{ github.run_id }}-${{ matrix.service }}

        - name: verify aws credentials
          run: aws sts get-caller-identity

        - name: login to ecr
          uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
          id: ecr-login
          with:
            mask-password: true

        - name: set up docker buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

        - name: set up trivy
          uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
          with:
            version: v0.74.0
            cache: true
        - name: prepare publish metadata
          id: meta
          shell: bash
          env:
            REGISTRY: ${{ steps.ecr-login.outputs.registry }}
            SERVICE: ${{ matrix.service }}
            SOURCE_SHA: ${{ github.sha }}
          run: |
            repo="retail-${SERVICE}"
            image="${REGISTRY}/${repo}:${SOURCE_SHA}"
            
            echo "repository=${repo}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
            echo "image_uri=${image}" >> "${GITHUB_OUTPUT}"
            

        - name: check immutability of image tag
          id: exist
          shell: bash
          env:
            REPO: ${{ steps.meta.outputs.repository }}
            IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          run: |
            digest="$(
                aws ecr batch-get-image --repository-name "${REPOSITORY}" --image-ids "imageTag=${IMAGE_TAG}" 	              --query 'images[0].imageId.imageDigest' 	              --output text
              )"
            if [[ -n "$digest" && "$digest" != "None" ]]; then
              echo "Image tag already exists in ECR: ${REPO}:${IMAGE_TAG}"
              echo "existing_digest=true" >> "${GITHUB_OUTPUT}"
              echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
            else
              echo "Image tag does not exist in ECR: ${REPO}:${IMAGE_TAG}"
              echo "existing_digest=false" >> "${GITHUB_OUTPUT}"
              echo "digest=" >> "${GITHUB_OUTPUT}"
            fi
        - name: build release image
          id: build
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
          with:
            context: ${{ matrix.context }}
            file: ${{ matrix.dockerfile }}
            push: false
            load: true
            tags: ${{ steps.meta.outputs.image_uri }}
            cache-from: type=gha,scope=retail-${{ matrix.service }}
            cache-to: type=gha,mode=max,scope=retail-${{ matrix.service }}

        - name: create trivy image report 
          if: steps.exist.outputs.existing_digest == 'false'
          shell: bash
          env:
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            SERVICE: ${{ matrix.service }}
          run: |
            mkdir -p reports
            trivy image \
              --severity HIGH,CRITICAL \
              --format json \
              --output "reports/trivy-image-${SERVICE}.json" \
              "${IMAGE_URI}"

        - name: gate fixable high and critical release
          if: steps.exist.outputs.existing_digest == 'false'
          shell: bash
          env:
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            SERVICE: ${{ matrix.service }}
          run: |
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "${IMAGE_URI}"

        - name: push scanned image to ecr
          if: steps.exist.outputs.existing_digest == 'false'
          env:
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          run: docker push "${IMAGE_URI}"

        - name: verify immutable ecr artifact 
          id: verify
          shell: bash
          env:
            REPO: ${{ steps.meta.outputs.repository }}
            IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          run: |
            digest="$(
                aws ecr batch-get-image 	              --repository-name "${REPOSITORY}" 	              --image-ids "imageTag=${IMAGE_TAG}" 	              --query 'images[0].imageId.imageDigest' 	              --output text
              )"
            test -n "$digest" && test "$digest" != "None"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
        - name: write publish record 
          shell: bash
          env:
            SERVICE: ${{ matrix.service }}
            SOURCE_SHA: ${{ github.sha }}
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            DIGEST: ${{ steps.verify.outputs.digest }}
            ALREADY_EXISTS: ${{ steps.existing.outputs.exists }}
          run: |
            mkdir -p reports
            if [[ "${ALREADY_EXISTS}" == "true" ]]; then
              echo "Image already exists in ECR: ${IMAGE_URI}"
            else
              echo "Image published to ECR: ${IMAGE_URI}"
            fi
            {
              echo "service: ${SERVICE}"
              echo "source_sha: ${SOURCE_SHA}"
              echo "image_uri: ${IMAGE_URI}"
              echo "digest: ${DIGEST}"
              echo "already_exists: ${ALREADY_EXISTS}"
            } >> ${GITHUB_STEP_SUMMARY}

        - name: upload publish evidance
          if: always()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          with:
            name: ecr-publish-${{ matrix.service }}-${{ github.sha }}
            path: reports
            if-no-files-found: error
            retention-days: 14
        
        - name: publish gate
          if: always()
          shell: bash
          env:
            SERVICE: ${{ matrix.service }}
            IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
            DIGEST: ${{ steps.verify.outputs.digest }}
            ALREADY_EXISTS: ${{ steps.exist.outputs.existing_digest }}
          run: |
            if [[ "${ALREADY_EXISTS}" == "true" ]]; then
              echo "Image already exists in ECR: ${IMAGE_URI}"
            else
              echo "Image published to ECR: ${IMAGE_URI}"
            fi
            {
              echo "service: ${SERVICE}"
              echo "image_uri: ${IMAGE_URI}"
              echo "digest: ${DIGEST}"
              echo "already_exists: ${ALREADY_EXISTS}"
            } >> ${GITHUB_STEP_SUMMARY}

    publish-gate:
      name: ecr publish gate
      needs: 
        - publish-container
        - detect-container-changes
      if: always()
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - name: checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false

        - name: publish gate summary
          shell: bash
          run: |
            echo "### Container publish gate"
            echo
            echo "- Source SHA: \`${{ github.sha }}\`"
            echo "- Services published:"
            for service in ${{ fromJson(needs.detect-container-changes.outputs.selected_services) }}; do
              echo "  - ${service}"
            done
        
    sonarqube-analyses:
      name: sonarqube
      runs-on: ubuntu-latest
      timeout-minutes: 20
      
      steps:
        - name: verify publish workflow results
          shell: bash
          run: |
            test "${{ needs.detect-publish-changes.result }}" = "success"

            if [[ "${{ needs.detect-publish-changes.outputs.has_change }}" == "true" ]]; then
              test "${{ needs.publish-images.result }}" = "success"
            else
              test "${{ needs.publish-images.result }}" = "skipped"
            fi
    trivy-repo:
      name: trivy
      runs-on: ubuntu-latest
      timeout-minutes: 15

      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false
        - name: setup trivy
          uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
          with:
            version: v0.74.0
            cache: true

        - name: create report directory
          run: mkdir -p reports

        - name: Report repository vulnerabilities
          run: |
            trivy fs --scanners vuln --severity HIGH,CRITICAL --offline-scan --format json --output reports/trivy-fs-vulnerabilities.json .
        - name: Report repository secrets
          run: |
            trivy fs --scanners secret --severity HIGH,CRITICAL --offline-scan --format json --output reports/trivy-fs-secrets.json .

        - name: Gate exposed secrets
          run: trivy fs --scanners secret --offline-scan --exit-code 1 .

        - name:  Gate fixable HIGH and CRITICAL vulnerabilities
          run: trivy fs --scanners vuln --severity HIGH,CRITICAL --offline-scan --ignore-unfixed --exit-code 1 .

        - name:  Upload repository security reports
          if: always()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          with:
            name: trivy-repository-${{ github.event.pull_request.head.sha }}
            path: reports
            if-no-files-found: error
            retention-days: 14

    trivy-iac:
      name: Trivy — IaC
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            persist-credentials: false
        
        - name: Set up Trivy
          uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
          with:
            version: v0.74.0
            cache: true

        - name: Create report directory
          run: mkdir -p reports
        - name: report terraform misconfiguration
          run: |
            trivy config \
            --severity HIGH,CRITICAL \
            --format json \
            --output reports/trivy-terraform.json \
            terraform

        - name: report kubernetes misconfigration
          run: |
            trivy config \
              --severity HIGH,CRITICAL \
              --format json \
              --output reports/trivy-kubernetes.json \
              k8s

        - name: gate terraform misconfigration
          run: |
            trivy config \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              terraform

        - name: gate kubernetes misconfigration
          run: |
            trivy config \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              k8s

        - name: upload iac and kubernetes reports
          if: always()
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          with:
            name: trivy-iac-${{github.event.pull_request.head.sha}}
            path: reports/
            if-no-files-found: error
            retention-days: 14

    