apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: retail
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: retail-store
    app.kubernetes.io/component: application
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: retail-store
        app.kubernetes.io/component: application
    spec:
      serviceAccount: checkout
      containers:
      - name: checkout
        image: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-orders
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            cpu: "150Mi"
            memory: "500m"
        ports:
        - name: http
          containerPort: 8080
