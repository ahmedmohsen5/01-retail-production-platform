apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: retail
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: retail-store
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: retail-store
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: checkout
      containers:
      - name: checkout
        image: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-checkout:e4c9ab09ef9fc04607c81dce94485eaa18d0a25a-36056467799-1
        imagePullPolicy: IfNotPresent
        envFrom:
          - configMapRef:
              name: checkout-config
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - name: http
          containerPort: 8080
