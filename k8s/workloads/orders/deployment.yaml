apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: retail
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: retail-store
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/part-of: retail-store
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: orders
      containers:
      - name: orders
        image: 147723036683.dkr.ecr.us-east-1.amazonaws.com/retail-orders:a6285f6d3a33ea41cb0de01edbbe2bcee6efcfd1-36147074794-1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - name: http
          containerPort: 8080
